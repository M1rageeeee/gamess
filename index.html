<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Набережные Челны: Начало</title>
    <style>
        /* --- СТИЛИ (МОБИЛЬНЫЙ ИНТЕРФЕЙС) --- */
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --secondary: #4b5563;
            --secondary-hover: #374151;
            --text: #e0e0e0;
            --text-muted: #9ca3af;
            --danger: #ef4444;
            --success: #10b981;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background-color: var(--panel-bg);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        header {
            background-color: #2c2c2c;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
            border-bottom: 1px solid #333;
            z-index: 10;
        }

        #main-content {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h2, h3 { margin-top: 0; text-align: center; }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button:active { transform: scale(0.98); }
        button:hover { background-color: var(--primary-hover); }
        button.secondary { background-color: var(--secondary); }
        button.secondary:hover { background-color: var(--secondary-hover); }
        button.danger { background-color: var(--danger); }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .log-box {
            background-color: #2c2c2c;
            padding: 15px;
            border-radius: 8px;
            font-size: 15px;
            line-height: 1.5;
            border-left: 4px solid var(--primary);
        }

        .stats-bar {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 10px;
            font-size: 12px;
        }
        
        .progress-bg {
            background: #333; height: 10px; border-radius: 5px; overflow: hidden; width: 100%;
        }
        .progress-fill {
            height: 100%; transition: width 0.3s;
        }
        .sympathy { background: #ec4899; } /* Розовый для симпатии */
        .trust { background: #8b5cf6; } /* Фиолетовый для доверия */

        .hidden { display: none !important; }
        
        /* Кастомный скроллбар */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--panel-bg); }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Верхняя панель -->
        <header>
            <span id="ui-day">День 1</span>
            <span id="ui-time" style="color: var(--primary);">Утро</span>
            <span id="ui-money">💵 500₽</span>
        </header>

        <div id="main-content">
            <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ -->
            <div id="screen-main" class="screen">
                <h2>Набережные Челны</h2>
                <p style="text-align: center; color: var(--text-muted); font-size: 14px;">Твой первый день в новом городе. Пора устраиваться!</p>
                
                <div class="menu-grid" style="margin-top: 20px;">
                    <button onclick="navTo('screen-map')">🗺️ Карта</button>
                    <button class="secondary" onclick="navTo('screen-contacts')">👥 Контакты</button>
                    <button class="secondary" onclick="alert('Инвентарь пуст. Купи что-нибудь в магазине (в разработке).')">🎒 Инвентарь</button>
                    <button class="secondary" onclick="alert('Смартфон скоро появится. Пока нет сети.')">📱 Смартфон</button>
                </div>
                
                <button class="danger" style="margin-top: 20px;" onclick="resetGame()">🔄 Начать заново</button>
            </div>

            <!-- ЭКРАН 2: КАРТА -->
            <div id="screen-map" class="screen hidden">
                <h3>Куда пойдем?</h3>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <button onclick="goToLocation('Общежитие')">🏠 Общежитие</button>
                    <button onclick="goToLocation('Кампус')">🎓 Кампус</button>
                    <button onclick="goToLocation('Центр')">🏙️ Центр</button>
                    <button onclick="goToLocation('Клуб «Маяк»')">🎸 Клуб «Маяк»</button>
                    <button onclick="goToLocation('Офис «Пиксель»')">💻 Офис «Пиксель»</button>
                    <button onclick="goToLocation('Парк')">🌳 Парк и набережная</button>
                </div>
                <button class="secondary" style="margin-top: 20px;" onclick="navTo('screen-main')">⬅️ В главное меню</button>
            </div>

            <!-- ЭКРАН 3: ЛОКАЦИЯ -->
            <div id="screen-location" class="screen hidden">
                <h3 id="loc-title">Локация</h3>
                <div class="log-box" id="loc-log">Ты находишься здесь.</div>
                
                <div id="loc-actions" style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;">
                    <!-- Действия -->
                </div>
                <button class="secondary" style="margin-top: auto;" onclick="navTo('screen-map')">⬅️ На карту</button>
            </div>

            <!-- ЭКРАН 4: ДИАЛОГ -->
            <div id="screen-dialog" class="screen hidden">
                <h3 id="npc-name">Имя</h3>
                
                <div class="stats-bar">
                    <div>Симпатия: <span id="npc-symp-text">0</span>%</div>
                    <div class="progress-bg"><div id="npc-symp-bar" class="progress-fill sympathy" style="width: 0%;"></div></div>
                    
                    <div>Доверие: <span id="npc-trust-text">0</span>%</div>
                    <div class="progress-bg"><div id="npc-trust-bar" class="progress-fill trust" style="width: 0%;"></div></div>
                </div>

                <div class="log-box" id="npc-text" style="flex: 1; margin-bottom: 15px; min-height: 120px;">
                    ...
                </div>
                <div id="dialog-options" style="display: flex; flex-direction: column; gap: 10px;">
                     <!-- Кнопки диалога -->
                </div>
            </div>
            
            <!-- ЭКРАН 5: КОНТАКТЫ -->
            <div id="screen-contacts" class="screen hidden">
                <h3>Твои знакомые</h3>
                <div id="contacts-list" style="display: flex; flex-direction: column; gap: 10px;">
                    <!-- Список контактов -->
                </div>
                <button class="secondary" style="margin-top: 20px;" onclick="navTo('screen-main')">⬅️ Назад</button>
            </div>
        </div>
    </div>

    <script>
        // --- ИНИЦИАЛИЗАЦИЯ ИГРОВОГО СОСТОЯНИЯ ---
        let gameState = {
            day: 1,
            timeIndex: 0,
            times: ['Утро', 'День', 'Вечер', 'Ночь'],
            money: 500,
            location: 'Общежитие',
            knownNPCs: [] // Храним ID знакомых
        };

        // База данных NPC
        const npcsDB = {
            'mark': { id: 'mark', name: 'Марк', loc: 'Общежитие', chance: 0.9, symp: 10, trust: 5, desc: 'Сосед. Веселый.' },
            'dasha': { id: 'dasha', name: 'Даша', loc: 'Кампус', chance: 0.7, symp: 5, trust: 0, desc: 'Радиоведущая.' },
            'alina': { id: 'alina', name: 'Алина', loc: 'Клуб «Маяк»', chance: 0.6, symp: 0, trust: 0, desc: 'Официантка. Строгая.' },
            'anton': { id: 'anton', name: 'Антон', loc: 'Клуб «Маяк»', chance: 0.4, symp: 0, trust: 0, desc: 'Менеджер.' },
            'timur': { id: 'timur', name: 'Тимур', loc: 'Офис «Пиксель»', chance: 0.8, symp: 0, trust: 0, desc: 'Наставник.' },
            'polina': { id: 'polina', name: 'Полина', loc: 'Офис «Пиксель»', chance: 0.5, symp: 0, trust: 0, desc: 'QA-стажер.' }
        };

        let currentNPC = null; // Текущий собеседник

        // --- СИСТЕМА СОХРАНЕНИЯ ---
        function saveGame() {
            localStorage.setItem('nchGameSave', JSON.stringify(gameState));
            // Сохраняем статы NPC (так как они меняются)
            localStorage.setItem('nchNpcsSave', JSON.stringify(npcsDB));
        }

        function loadGame() {
            const savedState = localStorage.getItem('nchGameSave');
            const savedNpcs = localStorage.getItem('nchNpcsSave');
            if (savedState && savedNpcs) {
                gameState = JSON.parse(savedState);
                const parsedNpcs = JSON.parse(savedNpcs);
                // Обновляем статы NPC
                for(let key in parsedNpcs) {
                    if(npcsDB[key]) {
                        npcsDB[key].symp = parsedNpcs[key].symp;
                        npcsDB[key].trust = parsedNpcs[key].trust;
                    }
                }
            }
            updateUI();
        }

        function resetGame() {
            if(confirm("Ты уверен, что хочешь стереть весь прогресс?")) {
                localStorage.removeItem('nchGameSave');
                localStorage.removeItem('nchNpcsSave');
                location.reload();
            }
        }

        // --- ИНТЕРФЕЙС ---
        function updateUI() {
            document.getElementById('ui-day').innerText = `День ${gameState.day}`;
            document.getElementById('ui-time').innerText = gameState.times[gameState.timeIndex];
            document.getElementById('ui-money').innerText = `💵 ${gameState.money}₽`;
            saveGame(); // Автосохранение при обновлении UI
        }

        function navTo(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
            
            if(screenId === 'screen-contacts') renderContacts();
        }

        function advanceTime() {
            gameState.timeIndex++;
            if (gameState.timeIndex > 3) {
                gameState.timeIndex = 0;
                gameState.day++;
            }
            updateUI();
        }

        // --- КАРТА И ЛОКАЦИИ ---
        function goToLocation(locName) {
            gameState.location = locName;
            document.getElementById('loc-title').innerText = locName;
            
            let log = document.getElementById('loc-log');
            log.innerHTML = `Ты пришёл в локацию: <b>${locName}</b>.<br>Время: ${gameState.times[gameState.timeIndex]}.`;
            
            const actionsContainer = document.getElementById('loc-actions');
            actionsContainer.innerHTML = ''; // Очистить старые кнопки

            // Кнопка "Осмотреться" (Поиск NPC)
            const exploreBtn = document.createElement('button');
            exploreBtn.innerText = '👀 Осмотреться (Найти людей)';
            exploreBtn.onclick = () => exploreLocation();
            actionsContainer.appendChild(exploreBtn);

            // Кнопки работ/учебы
            if (locName === 'Офис «Пиксель»' || locName === 'Клуб «Маяк»') {
                const workBtn = document.createElement('button');
                workBtn.className = 'secondary';
                workBtn.innerText = '💼 Поработать (Смена)';
                workBtn.onclick = () => doWork(locName);
                actionsContainer.appendChild(workBtn);
            }
            
            if (locName === 'Кампус') {
                const studyBtn = document.createElement('button');
                studyBtn.className = 'secondary';
                studyBtn.innerText = '📚 Учиться (Библиотека)';
                studyBtn.onclick = () => doStudy();
                actionsContainer.appendChild(studyBtn);
            }

            navTo('screen-location');
        }

        // --- ДЕЙСТВИЯ НА ЛОКАЦИИ ---
        function exploreLocation() {
            const loc = gameState.location;
            let foundNPC = null;

            // Ищем NPC, которые привязаны к этой локации
            for (let key in npcsDB) {
                let npc = npcsDB[key];
                if (npc.loc === loc && Math.random() < npc.chance) {
                    foundNPC = npc;
                    break; 
                }
            }

            // Шанс на случайного скрытого NPC (если никого из базы не нашли)
            if (!foundNPC && Math.random() < 0.15) {
                // Создаем временного NPC
                foundNPC = { id: 'random_' + Date.now(), name: 'Незнакомец', loc: loc, symp: 0, trust: 0, desc: 'Случайный прохожий.' };
                // Добавляем его в базу
                npcsDB[foundNPC.id] = foundNPC;
            }

            if (foundNPC) {
                if (!gameState.knownNPCs.includes(foundNPC.id)) {
                    gameState.knownNPCs.push(foundNPC.id); // Добавляем в контакты
                    document.getElementById('loc-log').innerHTML += `<br><br><span style="color: var(--primary);">✨ Ты познакомился с новым персонажем: <b>${foundNPC.name}</b>!</span>`;
                }
                startDialog(foundNPC);
            } else {
                document.getElementById('loc-log').innerHTML += `<br><br>Ты никого не встретил.`;
                advanceTime(); // Тратим время
            }
        }

        function doWork(loc) {
            let salary = 0;
            if (loc === 'Клуб «Маяк»') salary = 150 + Math.floor(Math.random() * 100);
            if (loc === 'Офис «Пиксель»') salary = 200 + Math.floor(Math.random() * 150);
            
            gameState.money += salary;
            document.getElementById('loc-log').innerHTML = `Ты отработал смену.<br>Заработано: <b style="color: var(--success);">+${salary}₽</b>`;
            advanceTime();
        }

        function doStudy() {
            document.getElementById('loc-log').innerHTML = `Ты просидел в библиотеке, изучая материалы.<br>(Навыки будут добавлены в следующем патче)`;
            advanceTime();
        }

        // --- СИСТЕМА ДИАЛОГОВ ---
        function startDialog(npc) {
            currentNPC = npc;
            document.getElementById('npc-name').innerText = `${npc.name} (${npc.desc})`;
            document.getElementById('npc-text').innerText = `Привет! Что хотел?`;
            
            updateNpcStatsUI();
            renderDialogOptions();
            
            navTo('screen-dialog');
        }

        function updateNpcStatsUI() {
            if(!currentNPC) return;
            document.getElementById('npc-symp-text').innerText = currentNPC.symp;
            document.getElementById('npc-symp-bar').style.width = currentNPC.symp + '%';
            
            document.getElementById('npc-trust-text').innerText = currentNPC.trust;
            document.getElementById('npc-trust-bar').style.width = currentNPC.trust + '%';
        }

        function renderDialogOptions() {
            const options = document.getElementById('dialog-options');
            options.innerHTML = '';

            // Кнопка "Поболтать"
            const btnTalk = document.createElement('button');
            btnTalk.innerText = '💬 Поболтать о жизни';
            btnTalk.onclick = () => dialogAction('talk');

            // Кнопка "Флиртовать" (Проверка порога)
            const btnFlirt = document.createElement('button');
            btnFlirt.className = 'secondary';
            btnFlirt.innerText = '😏 Флиртовать';
            btnFlirt.onclick = () => dialogAction('flirt');
            
            // Кнопка "Комплимент"
            const btnCompliment = document.createElement('button');
            btnCompliment.className = 'secondary';
            btnCompliment.innerText = '🌟 Сделать комплимент';
            btnCompliment.onclick = () => dialogAction('compliment');

            // Кнопка выхода
            const btnLeave = document.createElement('button');
            btnLeave.className = 'danger';
            btnLeave.innerText = '🚪 Попрощаться';
            btnLeave.onclick = () => {
                currentNPC = null;
                navTo('screen-location');
                advanceTime(); 
            };

            options.appendChild(btnTalk);
            options.appendChild(btnCompliment);
            options.appendChild(btnFlirt);
            options.appendChild(btnLeave);
        }

        function dialogAction(action) {
            const textBox = document.getElementById('npc-text');
            let text = "";
            
            if (action === 'talk') {
                text = `"О, классно поболтали! Ты новенький тут, да? Город у нас отличный, привыкнешь."`;
                currentNPC.symp += 5;
                currentNPC.trust += 3;
            } 
            else if (action === 'compliment') {
                // Шанс успеха зависит от рандома
                if (Math.random() > 0.3) {
                    text = `"Оу... спасибо! Ты довольно милый."`;
                    currentNPC.symp += 10;
                } else {
                    text = `"Эм... спасибо, конечно. Но давай без этого."`;
                    currentNPC.symp -= 2;
                }
            }
            else if (action === 'flirt') {
                // МЕХАНИКА ПОРОГА: Флирт работает только если симпатия > 30, а доверие > 20
                if (currentNPC.symp >= 30 && currentNPC.trust >= 20) {
                    text = `"Ммм... Ты мне тоже нравишься. Может, как-нибудь сходим куда-нибудь?"`;
                    currentNPC.symp += 15;
                    currentNPC.trust += 10;
                } else {
                    text = `"Эй, мы даже не знакомы толком. Притормози." <br><span style="color: var(--danger); font-size: 12px;">(Ты получил отказ. Нужно больше симпатии и доверия).</span>`;
                    currentNPC.symp -= 5;
                }
            }

            // Ограничители 0-100
            if(currentNPC.symp > 100) currentNPC.symp = 100;
            if(currentNPC.symp < 0) currentNPC.symp = 0;
            if(currentNPC.trust > 100) currentNPC.trust = 100;
            if(currentNPC.trust < 0) currentNPC.trust = 0;

            textBox.innerHTML = text;
            updateNpcStatsUI();
            saveGame();
        }

        // --- КОНТАКТЫ ---
        function renderContacts() {
            const list = document.getElementById('contacts-list');
            list.innerHTML = '';
            
            if(gameState.knownNPCs.length === 0) {
                list.innerHTML = `<p style="text-align: center; color: var(--text-muted);">Ты пока ни с кем не знаком. Иди гуляй по городу!</p>`;
                return;
            }

            gameState.knownNPCs.forEach(id => {
                const npc = npcsDB[id];
                if(!npc) return;

                const btn = document.createElement('button');
                btn.className = 'secondary';
                btn.style.justifyContent = 'space-between';
                
                let status = "Незнакомец";
                if(npc.symp >= 70 && npc.trust >= 60) status = "Близкий друг";
                else if(npc.symp >= 50) status = "Друг";
                else if(npc.symp >= 20) status = "Приятель";

                btn.innerHTML = `<span>👤 ${npc.name}</span> <span style="font-size: 12px; color: #aaa;">${status}</span>`;
                
                btn.onclick = () => {
                    // Телепортируемся к нему (упрощение для удобства)
                    gameState.location = npc.loc;
                    startDialog(npc);
                };
                
                list.appendChild(btn);
            });
        }

        // --- СТАРТ ИГРЫ ---
        window.onload = () => {
            loadGame();
            navTo('screen-main'); // Открываем главное меню
        };

    </script>
</body>
</html>
